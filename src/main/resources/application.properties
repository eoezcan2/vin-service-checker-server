server.port=8080

spring.application.name=vin-service-checker-server
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.jpa.hibernate.ddl-auto=update

# Security configurations
spring.security.user.name=admin
spring.security.user.password=admin

# JWT Configuration - In production, use environment variables
jwt.secret=${JWT_SECRET:f8Dhll3j4ka8fnf7834dj38fhkalaofj37fh8ajamf83kka82nmlla872hbf}

# Request size limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging configuration
logging.level.at.emreeocn.vinservicecheckerserver=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Server security headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# Actuator and Metrics Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.metrics.enable.process=true
management.metrics.enable.jvm=true
management.metrics.enable.system=false
management.metrics.enable.cpu=false
management.metrics.enable.disk=false
